<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panlilio Gallery</title>
  <style>
    body {
      background-color: #f0f8ff;
      font-family: Arial, sans-serif;
      margin: 50px auto;
      text-align: center;
      max-width: 600px;
    }
    h1 {
      color: #2c3e50;
      font-size: 2.2em;
      margin-bottom: 40px;
    }
    .kahon {
      background-color: #fff;
      padding: 30px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 40px;
    }
    .kahon h2 { color: #e74c3c; font-size: 1.8em; margin-top: 0; }
    .kahon p { color: #34495e; font-size: 18px; line-height: 1.8; margin: 15px 0; }
    .buton {
      display: inline-block;
      background-color: #3498db;
      color: white;
      padding: 14px 40px;
      font-size: 20px;
      text-decoration: none;
      border-radius: 10px;
      border: none;
      cursor: pointer;
    }
    .buton:hover { background-color: #2980b9; }
    input {
      padding: 12px 20px;
      font-size: 18px;
      border: 2px solid #ddd;
      border-radius: 8px;
      width: 250px;
      margin-bottom: 15px;
      text-align: center;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- PAGTATANONG NG PANGALAN -->
  <div id="form-section">
    <h1>👋 Welcome to Panlilio Gallery</h1>
    <p style="font-size: 18px; color: #555;">Enter your name to see your family! 👨‍👩‍👧‍👦</p>
    <input type="text" id="nameInput" placeholder="Type your name here...">
    <br><br>
    <button class="buton" onclick="submitName()">Enter 🚀</button>
  </div>
  <!-- LALABAS PAGKATAPOS MAGLAGAY -->
  <div id="content-section" class="hidden">
    <h1>Hello, <span id="displayName"></span>! 👋<br>Welcome to Panlilio Gallery</h1>

<div class="kahon">
  <h2>About Our Family 🏡</h2>
  <p><strong>Papa:</strong> <span id="papa-name"></span></p>
  <p><strong>Mama:</strong> <span id="mama-name"></span></p>
  <p><strong>Ate:</strong> <span id="ate-name"></span></p>
  <p><strong>Bunso:</strong> <span id="bunso-name"></span></p>
  <br>
  <p style="color: #e74c3c; font-style: italic;">Family is forever — a love that has no end. 💞</p>
</div>

<a href="pahina2.html" class="buton">See Our Family Photo 📸</a>


  </div>
<script>
// ✅ DITO ILALAGAY ANG MGA PANGALAN NG PAMILYA MO
const familyData = {
  "Nico": {
    papa: "Nico",
    mama: "Maria",
    ate: "Ana",
    bunso: "Nico"
  },
  "Ana": {
    papa: "Roberto",
    mama: "Maria",
    ate: "Ana",
    bunso: "Nico"
  },
  "Roberto": {
    papa: "Roberto",
    mama: "Maria",
    ate: "Ana",
    bunso: "Nico"
  },
  "Maria": {
    papa: "Roberto",
    mama: "Maria",
    ate: "Ana",
    bunso: "Nico"
  }
  // ✅ PWEDE MAGDAGDAG DITO — "Pangalan": {papa:"...", mama:"...", ate:"...", bunso:"..."}
};

window.onload = function() {
  const savedName = localStorage.getItem('visitorName');
  if (savedName) showMainContent(savedName);
};

function submitName() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) {
    alert('Please enter your name first! 😊');
    return;
  }
  localStorage.setItem('visitorName', name);
  showMainContent(name);
}

function showMainContent(name) {
  document.getElementById('form-section').classList.add('hidden');
  document.getElementById('content-section').classList.remove('hidden');
  document.getElementById('displayName').textContent = name;

  // ✅ KUNG KILALA ANG PANGALAN → ILABAS ANG PAMILYA
  const data = familyData[name];
  if (data) {
    document.getElementById('papa-name').textContent = data.papa;
    document.getElementById('mama-name').textContent = data.mama;
    document.getElementById('ate-name').textContent = data.ate;
    document.getElementById('bunso-name').textContent = data.bunso;
  } else {
    // ✅ KUNG HINDI KILALA → PANGALAN LANG ANG LALABAS
    document.getElementById('papa-name').textContent = "—";
    document.getElementById('mama-name').textContent = "—";
    document.getElementById('ate-name').textContent = "—";
    document.getElementById('bunso-name').textContent = "—";
  }
}
</script>
</body>
</html>
