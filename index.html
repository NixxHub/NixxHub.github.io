<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panlilio Gallery</title>
  <style>
    body {
      background-color: #f0f8ff;
      font-family: Arial, sans-serif;
      margin: 80px auto;
      text-align: center;
      max-width: 600px;
      padding: 0 20px;
    }
    h1 {
      color: #2c3e50;
      font-size: 2em;
      margin-bottom: 30px;
    }
    input {
      padding: 15px;
      font-size: 20px;
      border: 2px solid #3498db;
      border-radius: 10px;
      width: 280px;
      margin-bottom: 20px;
      text-align: center;
    }
    .buton {
      display: inline-block;
      background-color: #3498db;
      color: white;
      padding: 15px 50px;
      font-size: 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      text-decoration: none;
    }
    .buton:hover { background-color: #2980b9; }
    .kahon {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1);
      margin-top: 30px;
    }
    .kahon h2 { color: #e74c3c; }
    .kahon p { font-size: 18px; line-height: 1.8; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <!-- ILAGAY ANG PANGALAN -->
  <div id="form">
    <h1>👋 Welcome to Panlilio Gallery</h1>
    <p style="font-size: 18px; color: #555;">Ilagay ang pangalan mo:</p>
    <input type="text" id="nameBox" placeholder="Hal. Nico">
    <br>
    <button class="buton" onclick="goNext()">Enter ✅</button>
  </div>
  <!-- LALABAS PAGKATAPOS -->
  <div id="content" class="hidden">
    <h1 id="greeting">Hello! 👋</h1>
    <div class="kahon">
      <h2>Our Family 🏡</h2>
      <p style="color: #e74c3c; font-style: italic; font-size: 20px; margin-top: 10px;">
        Family is forever — a love that has no end. 💞
      </p>
      <p style="color: #666; margin-top: 15px;">
        Love, togetherness, and home — that is what family means. ❤️
      </p>
    </div>
    <br>
    <a href="pahina2.html" class="buton">See Our Family 📸</a>
  </div>
<script>
// ✅ DITO ANG MGA TAWAG SA BAWAT PAMILYA MEMBER
const roles = {
  "Nico": "Papa",
  "Roxselle": "Mama",
  "Kassandra": "Ate 1",
  "Alexandra": "Ate 2",
  "Prince": "Bunso"
};

function goNext() {
  let name = document.getElementById('nameBox').value.trim();
  if (!name) {
    alert('Pakilagay ang pangalan muna! 😊');
    return;
  }
  localStorage.setItem('visitorName', name);
  showPage(name);
}

function showPage(name) {
  document.getElementById('form').classList.add('hidden');
  document.getElementById('content').classList.remove('hidden');
  
  // ✅ KUNG KILALA ANG PANGALAN → Hello Papa/Mama/etc.
  if (roles[name]) {
    document.getElementById('greeting').textContent = `Hello ${roles[name]}! 👋`;
  } else {
    // ✅ KUNG HINDI KILALA → Hello, [Pangalan]!
    document.getElementById('greeting').textContent = `Hello, ${name}! 👋`;
  }
}
</script>
</body>
</html>
