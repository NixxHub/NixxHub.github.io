<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Panlilio Gallery</title>
  <style>
    body {
      background-color: #fef8e7;
      font-family: Arial, sans-serif;
      margin: 80px auto;
      text-align: center;
      max-width: 600px;
      padding: 0 20px;
    }
    h1 {
      color: #e65100;
      font-size: 2.2em;
      margin-bottom: 20px;
    }
    .heart {
      font-size: 60px;
      margin: 20px 0;
    }
    .message-box {
      background: white;
      padding: 35px 25px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin: 30px 0;
    }
    .message-box p {
      color: #5d4037;
      font-size: 19px;
      line-height: 1.8;
      margin: 15px 0;
    }
    .waiting {
      color: #ff8f00;
      font-style: italic;
      margin-top: 25px;
      font-size: 18px;
    }
    .nav {
      display: flex;
      justify-content: space-between;
      max-width: 500px;
      margin: 40px auto 0;
    }
    .btn {
      background-color: #3498db;
      color: white;
      padding: 12px 30px;
      font-size: 18px;
      text-decoration: none;
      border-radius: 8px;
    }
    .btn:hover { background-color: #2980b9; }
    .back { background-color: #95a5a6; }
    .back:hover { background-color: #7f8c8d; }
    .empty { width: 100px; }
  </style>
</head>
<body>
  <h1 id="greeting">Thank You! 🎊</h1>
  <div class="heart">💝</div>
  <div class="message-box">
    <p>Thank you for visiting our family gallery, <span id="visitor-name"></span>! ❤️</p>

<p>It means so much to have you here with us today. 🏡</p>

<p>Our family is growing — and so is this gallery! 💫</p>

<p class="waiting">✨ More photos, memories, and love coming soon...<br>
Waiting for update! 🔄✨</p>


  </div>
  <div class="nav">
    <a href="page3.html" class="btn back">Back</a>
    <div class="empty"></div>
  </div>
<script>
const roles = {
  "Nico": "Papa",
  "Roxselle": "Mama",
  "Kassandra": "Ate Kassy",
  "Alexandra": "Ate Lek",
  "Prince": "Bunso"
};

const name = localStorage.getItem('visitorName');
if (!name) {
  alert('Pakilagay muna ang pangalan sa unang pahina! 😊');
  window.location.href = 'index.html';
} else {
  let greetingName = roles[name] || name;
  document.getElementById('greeting').textContent = `Thank You, ${greetingName}! 🎊`;
  document.getElementById('visitor-name').textContent = greetingName;
}
</script>
</body>
</html>
